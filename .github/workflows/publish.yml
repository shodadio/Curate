name: Publish

# Every merge to main ships a fresh image, so what is deployed is always what was just
# verified: the release check in the Dockerfile runs during this build, and the commit that
# triggered it is the one stamped into the bundle. A manual run re-publishes the same commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes racing means two images and only one deploy worth having; the second build
# replaces the first rather than both of them shipping.
concurrency:
  group: publish-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The update notice can say what changed. A repository variable names that line when it is
      # set; otherwise the commit subject is used with its conventional prefix removed, so a
      # merge ships something readable instead of an empty note or a "fix:" prefix.
      - name: Read the release note
        id: note
        env:
          CONFIGURED_NOTE: ${{ vars.RELEASE_NOTE }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          note="$CONFIGURED_NOTE"
          if [ -z "$note" ]; then
            message="$COMMIT_MESSAGE"
            if [ -z "$message" ]; then message="$(git log -1 --pretty=%s)"; fi
            note="${message%%$'\n'*}"
            note="$(printf '%s' "$note" | sed -E 's/^(feat|fix|docs|build|ci|test|refactor|chore|perf)(\([^)]*\))?: //')"
          fi
          printf 'Release note: %s\n' "${note:-<none>}"
          echo "note=$note" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags name the commit, so a running container can be traced back without opening it:
      # the short SHA it was built from, plus a floating tag for the host to follow.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/shodadio/curator
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            RELEASE_NOTE=${{ steps.note.outputs.note }}
          # The build itself is the attestation that matters here; keyless signing of the
          # image would need an identity the private package cannot verify on pull.
          provenance: false
