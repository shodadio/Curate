name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # The committed bun.lock is the authoritative dependency set; npm has no lockfile here.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Test
        run: bun run test

      # The ranking benchmark is a regression gate: precision, MRR, the length pairs, determinism
      # and runtime, all against a fixed offline fixture, so it needs no network or API key.
      - name: Benchmark ranking
        run: bun run eval

      - name: Build
        run: |
          bun run build 2>&1 | tee build.log
          # A warning here means Vite fell back to its ESM config loader instead of loading
          # vite.config.ts natively (the __dirname regression). It never fails the build on its
          # own, so fail the job explicitly rather than letting it pass unnoticed.
          if grep -nE 'configLoader|__dirname' build.log; then
            echo '::error::The build emitted a config-loader warning; check vite.config.ts for CommonJS-only globals.'
            exit 1
          fi

      # The build writes its identity beside the bundle for Settings and /api/version.
      - name: Build records its identity
        run: bun run check:stamp
