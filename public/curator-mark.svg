<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="markBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0f2042" />
      <stop offset="60%" stop-color="#060e20" />
      <stop offset="100%" stop-color="#020612" />
    </radialGradient>
    <linearGradient id="markGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="markGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <radialGradient id="markSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with border -->
  <rect x="4" y="4" width="312" height="312" rx="68" fill="url(#markBg)" stroke="url(#markGold)" stroke-width="2.5" />

  <g transform="translate(160, 155) scale(0.88)">
    <!-- Sun Glow Behind -->
    <circle cx="0" cy="-60" r="48" fill="#f59e0b" opacity="0.3" filter="url(#markGlow)" />

    <!-- 7 Sun Beams -->
    <polygon points="0,-130 -7,-98 7,-98" fill="url(#markGold)" />
    <polygon points="26,-124 16,-95 29,-91" fill="url(#markGold)" />
    <polygon points="-26,-124 -29,-91 -16,-95" fill="url(#markGold)" />
    <polygon points="49,-108 34,-83 46,-76" fill="url(#markGold)" />
    <polygon points="-49,-108 -46,-76 -34,-83" fill="url(#markGold)" />
    <polygon points="65,-85 47,-67 56,-58" fill="url(#markGold)" />
    <polygon points="-65,-85 -56,-58 -47,-67" fill="url(#markGold)" />

    <!-- Rising Sun Core -->
    <path d="M -54,-45 A 54,54 0 0,1 54,-45 Z" fill="url(#markSun)" />

    <!-- Outer Book Cover Borders -->
    <path d="M -115,-32 L -115,68 L -105,74 L -105,-26 Z" fill="url(#markGold)" opacity="0.9" />
    <path d="M 115,-32 L 115,68 L 105,74 L 105,-26 Z" fill="url(#markGold)" opacity="0.9" />

    <!-- Main Book Pages Frame -->
    <path d="M -102,-42 C -50,-40 -15,-20 0,-10 L 0,65 C -20,52 -60,45 -102,48 Z" fill="none" stroke="url(#markGold)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 102,-42 C 50,-40 15,-20 0,-10 L 0,65 C 20,52 60,45 102,48 Z" fill="none" stroke="url(#markGold)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Dark Inner Page Fill -->
    <path d="M -94,-34 C -50,-32 -20,-15 -6,-6 L -6,57 C -25,47 -60,41 -94,42 Z" fill="#061226" />
    <path d="M 94,-34 C 50,-32 20,-15 6,-6 L 6,57 C 25,47 60,41 94,42 Z" fill="#061226" />

    <!-- Sparkle Stars -->
    <path d="M -50,-10 Q -50,5 -35,5 Q -50,5 -50,20 Q -50,5 -65,5 Q -50,5 -50,-10 Z" fill="url(#markGoldLight)" />
    <path d="M -30,-22 Q -30,-15 -23,-15 Q -30,-15 -30,-8 Q -30,-15 -37,-15 Q -30,-15 -30,-22 Z" fill="url(#markGoldLight)" opacity="0.9" />

    <!-- Winding Roadway Emerging From Horizon -->
    <path d="M 0,-10 
             C 4,8 18,22 30,30
             C 45,40 45,55 25,72
             C 5,87 -20,95 -45,115
             C -65,130 -85,150 -98,175
             L -62,175
             C -45,150 -25,132 -2,118
             C 22,102 48,90 56,70
             C 65,48 50,30 35,18
             C 20,7 8,-2 0,-10 Z" 
          fill="url(#markGold)" />

    <!-- Bottom Page Spine Accent Line -->
    <path d="M -102,48 L -90,62 C -50,54 -15,62 0,72 C 15,62 50,54 90,62 L 102,48" fill="none" stroke="url(#markGold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>